<h1>My name is Ayushi</h1>
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>RAG Simulator</title>

<style>

body{
    margin:0;
    font-family:Segoe UI;
    background:linear-gradient(135deg,#0f172a,#1e293b);
    color:white;
}

h1{
    text-align:center;
    margin-top:20px;
}

.subtitle{
    text-align:center;
    color:#cbd5e1;
}

.container{
    width:1200px;
    margin:auto;
}

.pipeline{
    display:flex;
    justify-content:space-between;
    margin-top:40px;
    flex-wrap:wrap;
}

.card{
    width:170px;
    background:rgba(255,255,255,.08);
    border-radius:18px;
    padding:15px;
    backdrop-filter:blur(8px);
    text-align:center;
    transition:.4s;
    cursor:pointer;
    border:1px solid rgba(255,255,255,.1);
}

.card:hover{
    transform:translateY(-8px);
    background:#2563eb;
}

.arrow{
    font-size:35px;
    display:flex;
    align-items:center;
}

#display{
    margin-top:50px;
    background:white;
    color:#111;
    border-radius:20px;
    padding:30px;
    min-height:430px;
}

button{
    margin-top:20px;
    padding:12px 25px;
    border:none;
    border-radius:10px;
    background:#2563eb;
    color:white;
    cursor:pointer;
    font-size:16px;
}

.chunk{
    display:inline-block;
    padding:12px;
    margin:8px;
    border-radius:10px;
    background:#dbeafe;
    transition:.4s;
}

.vector{
    display:inline-block;
    background:#dcfce7;
    padding:12px;
    border-radius:10px;
    margin:10px;
    font-family:monospace;
}

.highlight{
    background:#22c55e !important;
    color:white;
}

.stepTitle{
    font-size:28px;
    margin-bottom:20px;
}

.progress{
    width:100%;
    height:10px;
    background:#ddd;
    border-radius:20px;
    overflow:hidden;
    margin-bottom:25px;
}

.bar{
    height:100%;
    width:0%;
    background:#2563eb;
    transition:1s;
}

</style>
</head>

<body>

<h1>Retrieval-Augmented Generation (RAG) Simulator</h1>
<div class="subtitle">
See every step visually.
</div>

<div class="container">

<div class="pipeline">

<div class="card" onclick="step1()">1<br>Document</div>
<div class="arrow">➜</div>

<div class="card" onclick="step2()">2<br>Chunking</div>
<div class="arrow">➜</div>

<div class="card" onclick="step3()">3<br>Embedding</div>
<div class="arrow">➜</div>

<div class="card" onclick="step4()">4<br>User Query</div>
<div class="arrow">➜</div>

<div class="card" onclick="step5()">5<br>Similarity Search</div>
<div class="arrow">➜</div>

<div class="card" onclick="step6()">6<br>LLM Answer</div>

</div>

<div id="display">

<div class="progress">
<div class="bar" id="bar"></div>
</div>

Click any step above.

</div>

</div>

<script>

const display=document.getElementById("display");
const bar=document.getElementById("bar");

function progress(x){
bar.style.width=x+"%";
}

function step1(){

progress(15);

display.innerHTML=`

<div class='progress'><div class='bar' style='width:15%'></div></div>

<div class='stepTitle'>Step 1 : Original Documents</div>

Imagine these are company documents.

<hr>

Customer Support Manual

<hr>

Product Documentation

<hr>

Return Policy

<hr>

Warranty Information

<br><br>

Nothing is searchable yet.

`;

}

function step2(){

progress(35);

display.innerHTML=`

<div class='progress'><div class='bar' style='width:35%'></div></div>

<div class='stepTitle'>Step 2 : Chunking</div>

The documents are broken into smaller pieces.

<br><br>

<div class="chunk">Chunk 1<br>Warranty lasts 2 years.</div>

<div class="chunk">Chunk 2<br>Battery replacement policy.</div>

<div class="chunk">Chunk 3<br>Return within 30 days.</div>

<div class="chunk">Chunk 4<br>Compression boots improve circulation.</div>

<br><br>

Smaller chunks improve retrieval accuracy.

`;

}

function step3(){

progress(55);

display.innerHTML=`

<div class='progress'><div class='bar' style='width:55%'></div></div>

<div class='stepTitle'>Step 3 : Embedding</div>

Each chunk becomes a vector.

<br><br>

<div class="vector">

Chunk1

<br>

[0.22,0.91,0.44...]

</div>

<div class="vector">

Chunk2

<br>

[0.18,0.54,0.80...]

</div>

<div class="vector">

Chunk3

<br>

[0.92,0.15,0.43...]

</div>

<div class="vector">

Chunk4

<br>

[0.72,0.84,0.61...]

</div>

<br><br>

Vectors represent semantic meaning.

`;

}

function step4(){

progress(70);

display.innerHTML=`

<div class='progress'><div class='bar' style='width:70%'></div></div>

<div class='stepTitle'>Step 4 : User Query</div>

User asks:

<h2>

"How long is the warranty?"

</h2>

The query is also converted into a vector.

<br>

<div class="vector">

Query

<br>

[0.24,0.88,0.41...]

</div>

`;

}

function step5(){

progress(90);

display.innerHTML=`

<div class='progress'><div class='bar' style='width:90%'></div></div>

<div class='stepTitle'>Step 5 : Similarity Search</div>

The database compares the query vector with every chunk.

<br><br>

<div class="chunk highlight">

Chunk 1 ✓

Warranty lasts 2 years.

</div>

<div class="chunk">

Chunk 2

Battery replacement.

</div>

<div class="chunk">

Chunk 3

Return Policy.

</div>

<div class="chunk">

Chunk 4

Compression boots improve circulation.

</div>

<br><br>

Highest similarity score wins.

`;

}

function step6(){

progress(100);

display.innerHTML=`

<div class='progress'><div class='bar' style='width:100%'></div></div>

<div class='stepTitle'>Step 6 : Retrieval + Generation</div>

Prompt sent to LLM:

<hr>

Context:

Warranty lasts 2 years.

<hr>

Question:

How long is the warranty?

<hr>

LLM Answer:

<h2 style="color:green">

The warranty period is 2 years.

</h2>

Notice:

The LLM did NOT search the whole database.

It answered using the retrieved context.

`;

}

</script>

</body>
</html>
